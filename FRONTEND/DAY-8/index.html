<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="bento-grid">
        <!-- burger-card -->
        <div class="card burger-card">
          <img src="./images/card-burger.png" alt="burger" class="burger-img" />
          <div class="burger-info">
            <h2>Cheese Burger</h2>
            <p>$4.99</p>
          </div>
        </div>

        <!-- pizza-card -->
        <div class="card pizza-card">
          <img src="./images/card-restro.png" alt="pizza" class="pizza-img" />
        </div>

        <!-- restro-card -->
        <div class="card restro-card">
          <img src="./images/card-burger.png" alt="restro" class="restro-img" />
        </div>

        <!-- menu-card -->
        <div class="card menu-card">
          <div class="menu-header">
            <h2>Special Menu</h2>
          </div>
        </div>

        <!-- analytics-card -->
        <div class="card analytics-card">
          <div class="analytics-header">Sales Analytics</div>
        </div>

        <!-- guy-card -->
        <div class="card guy-card"></div>

        <!-- notifications-card -->
        <div class="card notifications-card"></div>

        <!-- ratings-card -->
        <div class="card ratings-card"></div>

        <!-- map-card -->
        <div class="card map-card"></div>
      </div>
    </div>
  </body>
</html>
