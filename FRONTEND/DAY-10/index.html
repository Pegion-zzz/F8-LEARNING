<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .animation-input {
        font-size: 1.5rem;
        width: 50px;
        margin-top: 16px;
        padding: 10px 15px;
        font-size: 1rem;
        border-radius: 99px;
        outline: none;
        border: 1px solid;
      }
      .animation-input:focus {
        width: 150px;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <input class="animation-input" type="text" placeholder="Enter" />
  </body>
</html>
